<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaiChiApp</title>
    <style>
        :root { --accent: #81C784; --prep: #FFB74D; --bg: #1A1A1A; --card: #2D2D2D; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        
        /* Menu */
        .menu-item { background: var(--card); padding: 25px; border-radius: 15px; margin-bottom: 15px; cursor: pointer; border: 1px solid #444; text-align: left; }
        .menu-item h2 { margin: 0; color: var(--accent); }
        .menu-item p { margin: 5px 0 0; color: #888; font-size: 0.9rem; }
        
        /* Timer Screen */
        #ex-name { font-size: 2.2rem; color: var(--accent); font-weight: bold; margin-top: 20px; line-height: 1.2; }
        #ex-desc { font-size: 1.1rem; color: #BBB; font-style: italic; min-height: 3rem; margin-top: 10px; padding: 0 10px; line-height: 1.4; }
        #phase { font-size: 1.2rem; letter-spacing: 2px; color: #888; margin-top: 15px; text-transform: uppercase; }
        #display { font-size: 7rem; font-weight: bold; margin: 5px 0; font-variant-numeric: tabular-nums; }
        
        button { width: 100%; padding: 20px; font-size: 1.2rem; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
        .btn-start { background: var(--accent); color: #1A1A1A; margin-top: 20px; }
        .btn-back { background: #444; color: white; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 style="margin-bottom: 30px;">Tai Chi Sessions</h1>
        <div id="session-list"></div>
    </div>

    <div id="timer-screen" class="hidden">
        <div id="ex-name">---</div>
        <div id="ex-desc">---</div>
        <div id="phase">GET READY</div>
        <div id="display">00:00</div>
        <div id="progress" style="color: #666;">Step 1 of X</div>
        
        <button class="btn-start" id="startBtn" onclick="toggleTimer()">START SESSION</button>
        <button class="btn-back" onclick="location.reload()">BACK TO MENU</button>
    </div>

    <script>
        const sessions = [
            {
                title: "9 Flow Routine",
                exercises: [
                    {
                        name: "Up and Down Together",
                        work: 30,
                        prep: 5,
                        description: "Rising up with the arms while simultaneously lifting up the calves."
                    },
                    {
                        name: "Rising Knee Twist",
                        work: 30,
                        prep: 5,
                        description: "Twisting motions while balancing on one side to get blood moving."
                    },
                    {
                        name: "Golden Turtle in the Water",
                        work: 30,
                        prep: 5,
                        description: "Wide stance; reach down to touch the alternate foot with the hand."
                    },
                    {
                        name: "Bodyweight Lifts",
                        work: 30,
                        prep: 5,
                        description: "Tilt hips back with arms forward, then thrust forward and rise onto calves."
                    },
                    {
                        name: "Knee Bend Toe Touches",
                        work: 30,
                        prep: 5,
                        description: "Side lunge motion touching the alternate foot while keeping the extended leg straight."
                    },
                    {
                        name: "Torso Twist",
                        work: 30,
                        prep: 5,
                        description: "Spin and look behind you with loose arms wrapping around the body to open the fascia."
                    },
                    {
                        name: "Spread Your Wings",
                        work: 30,
                        prep: 5,
                        description: "Move the arms in a backwards circular motion."
                    },
                    {
                        name: "Squats",
                        work: 30,
                        prep: 5,
                        description: "Drop down to a full 90-degree angle with a wide leg stance."
                    },
                    {
                        name: "Forward Back Clap",
                        work: 30,
                        prep: 5,
                        description: "Relaxed front-and-back clapping to increase heart rate and blood flow."
                    }
                    title: "7-Minute Tai Chi Routine",
            description: "Seven moves in seven minutes to boost energy naturally [1].",
            exercises: [
                { 
                    name: "Hops", 
                    work: 45, 
                    prep: 5, 
                    description: "Lightly jumping up and down with relaxed shoulders to release tension [1]." 
                },
                { 
                    name: "Alternating Arms", 
                    work: 60, 
                    prep: 5, 
                    description: "Moving arms up and down in an alternating rhythm [1]." 
                },
                { 
                    name: "Dead Arms", 
                    work: 60, 
                    prep: 5, 
                    description: "Twisting shoulders with loose arms slapping the body to loosen fascia [1]." 
                },
                { 
                    name: "Standing Prayer Twist", 
                    work: 60, 
                    prep: 5, 
                    description: "Twisting from left to right with prayer hands while keeping the head facing forward [1]." 
                },
                { 
                    name: "Bent Over Twist", 
                    work: 60, 
                    prep: 5, 
                    description: "Twisting 180 degrees with arms straight while looking down at the ground [1]." 
                },
                { 
                    name: "Marches", 
                    work: 60, 
                    prep: 5, 
                    description: "High-intensity marches, bringing knees up and slapping kneecaps with hands [1]." 
                },
                { 
                    name: "Body Waves", 
                    work: 60, 
                    prep: 5, 
                    description: "Raising arms up and 'whooshing' them down as if throwing a ball to the ground [1]." 
                }
                ]
            }
        ];

        let currentExList = [];
        let currentIndex = 0;
        let timeLeft = 0;
        let isWorking = false; 
        let timerId = null;
        const chime = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        const list = document.getElementById('session-list');
        sessions.forEach((s, idx) => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            div.onclick = () => selectSession(idx);
            div.innerHTML = `<h2>${s.title}</h2><p>${s.exercises.length} Movements • Warm-up Flow</p>`;
            list.appendChild(div);
        });

        function selectSession(idx) {
            currentExList = sessions[idx].exercises;
            currentIndex = 0;
            setupExercise();
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('timer-screen').classList.remove('hidden');
        }

        function setupExercise() {
            isWorking = false;
            timeLeft = currentExList[currentIndex].prep;
            updateUI();
        }

        function toggleTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                document.getElementById('startBtn').innerText = "RESUME";
            } else {
                document.getElementById('startBtn').innerText = "PAUSE";
                timerId = setInterval(tick, 1000);
            }
        }

        function tick() {
            if (timeLeft > 0) {
                timeLeft--;
            } else {
                chime.play();
                if (!isWorking) {
                    isWorking = true;
                    timeLeft = currentExList[currentIndex].work;
                } else {
                    currentIndex++;
                    if (currentIndex < currentExList.length) {
                        setupExercise();
                    } else {
                        return finish();
                    }
                }
            }
            updateUI();
        }

        function updateUI() {
            const ex = currentExList[currentIndex];
            document.getElementById('ex-name').innerText = ex.name;
            document.getElementById('ex-desc').innerText = ex.description;
            document.getElementById('phase').innerText = isWorking ? "EXERCISE" : "PREP";
            document.getElementById('phase').style.color = isWorking ? "var(--accent)" : "var(--prep)";
            document.getElementById('display').innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
            document.getElementById('progress').innerText = `Step ${currentIndex + 1} of ${currentExList.length}`;
        }

        function finish() {
            clearInterval(timerId);
            document.getElementById('phase').innerText = "FINISHED";
