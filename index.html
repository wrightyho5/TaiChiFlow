<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaiChiApp</title>
    <style>
        :root { --accent: #81C784; --prep: #FFB74D; --bg: #1A1A1A; --card: #2D2D2D; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        
        /* Menu */
        .menu-item { background: var(--card); padding: 25px; border-radius: 15px; margin-bottom: 15px; cursor: pointer; border: 1px solid #444; text-align: left; }
        .menu-item h2 { margin: 0; color: var(--accent); }
        .menu-item p { margin: 5px 0 0; color: #888; font-size: 0.9rem; }
        
        /* Timer Screen */
        #ex-name { font-size: 2.2rem; color: var(--accent); font-weight: bold; margin-top: 20px; line-height: 1.2; }
        #ex-desc { font-size: 1.5rem; color: #AAA; font-style: italic; min-height: 3rem; margin-top: 10px; padding: 0 10px; line-height: 1.4; }
        #phase { font-size: 1.5rem; letter-spacing: 2px; color: #888; margin-top: 15px; text-transform: uppercase; }
        #display { font-size: 7rem; font-weight: bold; margin: 5px 0; font-variant-numeric: tabular-nums; }
        
        /* BIGGER PROGRESS TEXT */
        #progress { font-size: 1.8rem; font-weight: bold; color: #DDD; margin: 15px 0; }
        
        button { width: 100%; padding: 20px; font-size: 1.2rem; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
        .btn-start { background: var(--accent); color: #1A1A1A; margin-top: 10px; }
        .btn-back { background: #444; color: white; margin-top: 15px; }

        /* Navigation Row */
        .nav-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-nav { background: #333; color: white; padding: 15px; font-size: 1rem; flex: 1; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 style="margin-bottom: 30px;">Tai Chi Sessions</h1>
        <div id="session-list"></div>
    </div>

    <div id="timer-screen" class="hidden">
        <div id="ex-name">---</div>
        <div id="ex-desc">---</div>
        <div id="phase">GET READY</div>
        <div id="display">00:00</div>
        
        <div id="progress">Step 1 of X</div>
        
        <button class="btn-start" id="startBtn" onclick="toggleTimer()">START SESSION</button>

        <div class="nav-row">
            <button class="btn-nav" onclick="prevExercise()">← PREV</button>
            <button class="btn-nav" onclick="skipExercise()">SKIP →</button>
        </div>

        <button class="btn-back" onclick="location.reload()">BACK TO MENU</button>
    </div>

    <script>
        const sessions = [
            {
                title: "9 Flow Routine",
                exercises: [
                    { name: "Up and Down Together", work: 30, prep: 5, description: "Rising up with the arms while simultaneously lifting up the calves." },
                    { name: "Rising Knee Twist", work: 30, prep: 5, description: "Twisting motions while balancing on one side to get blood moving." },
                    { name: "Golden Turtle in the Water", work: 30, prep: 5, description: "Wide stance; reach down to touch the alternate foot with the hand." },
                    { name: "Bodyweight Lifts", work: 30, prep: 5, description: "Tilt hips back with arms forward, then thrust forward and rise onto calves." },
                    { name: "Knee Bend Toe Touches", work: 30, prep: 5, description: "Side lunge motion touching the alternate foot while keeping the extended leg straight." },
                    { name: "Torso Twist", work: 30, prep: 5, description: "Spin and look behind you with loose arms wrapping around the body to open the fascia." },
                    { name: "Spread Your Wings", work: 30, prep: 5, description: "Move the arms in a backwards circular motion." },
                    { name: "Squats", work: 30, prep: 5, description: "Drop down to a full 90-degree angle with a wide leg stance." },
                    { name: "Forward Back Clap", work: 30, prep: 5, description: "Relaxed front-and-back clapping to increase heart rate and blood flow." }
                ]
            },
            {
                title: "Core",
                exercises: [
                    { name: "Plank", work: 60, prep: 5, description: "Normal Plank" },
                    { name: "Side Plank", work: 30, prep: 8, description: "Side Plank" },
                    { name: "Side Plank", work: 30, prep: 8, description: "Side Plank" },
                    { name: "Superman", work: 15, prep: 5, description: "Supermans" },
                    { name: "Superman", work: 15, prep: 4, description: "Supermans" },
                    { name: "Superman", work: 15, prep: 4, description: "Supermans" },
                    { name: "Push Ups", work: 90, prep: 5, description: "40-50" }
                ]
            },
            {
                title: "7-Minute Tai Chi Routine",
                exercises: [
                    { name: "Hops", work: 45, prep: 5, description: "Lightly jumping up and down with relaxed shoulders to release tension." },
                    { name: "Alternating Arms", work: 60, prep: 5, description: "Moving arms up and down in an alternating rhythm." },
                    { name: "Dead Arms", work: 60, prep: 5, description: "Twisting shoulders with loose arms slapping the body to loosen fascia." },
                    { name: "Standing Prayer Twist", work: 60, prep: 5, description: "Twisting from left to right with prayer hands while keeping the head facing forward." },
                    { name: "Bent Over Twist", work: 60, prep: 5, description: "Twisting 180 degrees with arms straight while looking down at the ground." },
                    { name: "Marches", work: 60, prep: 5, description: "High-intensity marches, bringing knees up and slapping kneecaps with hands." },
                    { name: "Body waves", work: 60, prep: 5, description: "Raising arms up and 'whooshing' them down as if throwing a ball to the ground." }
                ]
            },
            {
                title: "Full Flow Routine",
                exercises: [
                    { name: "Hops", work: 30, prep: 5, description: "Lightly jumping up and down with relaxed shoulders to release tension." },
                    { name: "Alternating Arms", work: 45, prep: 5, description: "Moving arms up and down in an alternating rhythm." },
                    { name: "Dead Arms", work: 45, prep: 5, description: "Twisting shoulders with loose arms slapping the body to loosen fascia." },
                    { name: "Standing Prayer Twist", work: 30, prep: 5, description: "Twisting from left to right with prayer hands while keeping the head facing forward." },
                    { name: "Side bend Pendulumns", work: 30, prep: 5, description: "Side bends, arms over head other arm passing across stomach. Swing like a pendulumn." },
                    { name: "Marches", work: 45, prep: 5, description: "High-intensity marches, bringing knees up and slapping kneecaps with hands." },
                    { name: "Hand Throw Waves", work: 30, prep: 5, description: "Raising arms up and 'whooshing' them down as if throwing a ball to the ground." },
                    { name: "Rising Knee Twist 1", work: 20, prep: 5, description: "Twisting motions while balancing on one side to get blood moving." },
                    { name: "Rising Knee Twist 2", work: 20, prep: 2, description: "Other side" },
                    { name: "Golden Turtle in the Water", work: 30, prep: 5, description: "Wide stance; reach down to touch the alternate foot with the hand." },
                    { name: "Bodyweight Lifts", work: 30, prep: 8, description: "Tilt hips back with arms forward, then thrust forward and rise onto calves." },
                    { name: "Torso Twist", work: 30, prep: 5, description: "Spin and look behind you with loose arms wrapping around the body to open the fascia." },
                    { name: "Spread Your Wings", work: 30, prep: 5, description: "Move the arms in a backwards circular motion." },
                    { name: "Squats", work: 30, prep: 7, description: "Drop down to a full 90-degree angle with a wide leg stance." },
                    { name: "Golf Swing", work: 30, prep: 5, description: "Golf swings, knee slkight bend and twist to increase motion range." },
                    { name: "Bent Over Twist", work: 30, prep: 5, description: "Twisting 180 degrees with arms straight while looking down at the ground." },
                    { name: "Forward Back Clap", work: 30, prep: 5, description: "Relaxed front-and-back clapping to increase heart rate and blood flow." }
                ]
            }
        ];

        let currentExList = [];
        let currentIndex = 0;
        let timeLeft = 0;
        let isWorking = false; 
        let timerId = null;
        const chime = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        const list = document.getElementById('session-list');
        sessions.forEach((s, idx) => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            div.onclick = () => selectSession(idx);
            div.innerHTML = `<h2>${s.title}</h2><p>${s.exercises.length} Movements • Warm-up Flow</p>`;
            list.appendChild(div);
        });

        function selectSession(idx) {
            currentExList = sessions[idx].exercises;
            currentIndex = 0;
            setupExercise();
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('timer-screen').classList.remove('hidden');
        }

        function setupExercise() {
            isWorking = false;
            timeLeft = currentExList[currentIndex].prep;
            updateUI();
        }

        function skipExercise() {
            currentIndex++;
            if (currentIndex < currentExList.length) {
                setupExercise();
            } else {
                finish();
            }
        }

        function prevExercise() {
            if (currentIndex > 0) {
                currentIndex--;
                setupExercise();
            }
        }

        function toggleTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                document.getElementById('startBtn').innerText = "RESUME";
            } else {
                document.getElementById('startBtn').innerText = "PAUSE";
                timerId = setInterval(tick, 1000);
            }
        }

        function tick() {
            if (timeLeft > 0) {
                timeLeft--;
            } else {
                chime.play();
                if (!isWorking) {
                    isWorking = true;
                    timeLeft = currentExList[currentIndex].work;
                } else {
                    skipExercise();
                    return;
                }
            }
            updateUI();
        }

        function updateUI() {
            const ex = currentExList[currentIndex];
            document.getElementById('ex-name').innerText = ex.name;
            document.getElementById('ex-desc').innerText = ex.description;
            document.getElementById('phase').innerText = isWorking ? "EXERCISE" : "PREP";
            document.getElementById('phase').style.color =
