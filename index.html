<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaiChiApp</title>
    <style>
        :root { --accent: #81C784; --prep: #FFB74D; --bg: #1A1A1A; --card: #2D2D2D; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; text-align: center; }
        .hidden { display: none !important; }
        .menu-item { background: var(--card); padding: 25px; border-radius: 15px; margin-bottom: 15px; cursor: pointer; border: 1px solid #444; display: block; width: 100%; box-sizing: border-box; }
        .menu-item h2 { margin: 0; color: var(--accent); }
        #display { font-size: 7rem; font-weight: bold; margin: 10px 0; font-variant-numeric: tabular-nums; }
        #ex-name { font-size: 2rem; color: var(--accent); min-height: 2.5rem; margin-top: 20px; font-weight: bold; }
        #phase { font-size: 1.2rem; letter-spacing: 2px; color: #888; margin-top: 10px; }
        button { width: 100%; padding: 20px; font-size: 1.2rem; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
        .btn-start { background: var(--accent); color: #1A1A1A; margin-top: 20px; }
        .btn-back { background: #444; color: white; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 style="margin-bottom: 30px;">Tai Chi Sessions</h1>
        
        <div class="menu-item" onclick="selectSession(0)">
            <h2>9 Flow</h2>
            <p>3 Steps • 60s Work</p>
        </div>

        <div class="menu-item" onclick="selectSession(1)">
            <h2>7 Flow</h2>
            <p>2 Steps • 45s Work</p>
        </div>
    </div>

    <div id="timer-screen" class="hidden">
        <div id="ex-name">---</div>
        <div id="phase">GET READY</div>
        <div id="display">00:00</div>
        <div id="progress" style="color: #666;">Step 1 of X</div>
        
        <button class="btn-start" id="startBtn" onclick="toggleTimer()">START SESSION</button>
        <button class="btn-back" onclick="location.reload()">BACK TO MENU</button>
    </div>

    <script>
        const sessions = [
            {
                title: "9 Flow",
                exercises: [
                    { name: "Swinging Arms", work: 60, prep: 10 },
                    { name: "Opening Posture", work: 60, prep: 10 },
                    { name: "Painting Rainbows", work: 60, prep: 5 }
                ]
            },
            {
                title: "7 Flow",
                exercises: [
                    { name: "Cloud Hands", work: 45, prep: 10 },
                    { name: "Pushing Waves", work: 45, prep: 5 }
                ]
            }
        ];

        let currentExList = [];
        let currentIndex = 0;
        let timeLeft = 0;
        let isWorking = false; 
        let timerId = null;
        const chime = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        function selectSession(idx) {
            currentExList = sessions[idx].exercises;
            currentIndex = 0;
            setupExercise();
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('timer-screen').classList.remove('hidden');
        }

        function setupExercise() {
            isWorking = false;
            timeLeft = currentExList[currentIndex].prep;
            updateUI();
        }

        function toggleTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                document.getElementById('startBtn').innerText = "RESUME";
            } else {
                document.getElementById('startBtn').innerText = "PAUSE";
                timerId = setInterval(tick, 1000);
            }
        }

        function tick() {
            if (timeLeft > 0) {
                timeLeft--;
            } else {
                chime.play();
                if (!isWorking) {
                    isWorking = true;
                    timeLeft = currentExList[currentIndex].work;
                } else {
                    currentIndex++;
                    if (currentIndex < currentExList.length) {
                        setupExercise();
                    } else {
                        return finish();
                    }
                }
            }
            updateUI();
        }

        function updateUI() {
            const ex = currentExList[currentIndex];
            document.getElementById('ex-name').innerText = ex.name;
            document.getElementById('phase').innerText = isWorking ? "EXERCISE" : "PREP";
            document.getElementById('phase').style.color = isWorking ? "var(--accent)" : "var(--prep)";
            document.getElementById('display').innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
            document.getElementById('progress').innerText = `Step ${currentIndex + 1} of ${currentExList.length}`;
        }

        function finish() {
            clearInterval(timerId);
            document.getElementById('phase').innerText = "FINISHED";
            document.getElementById('display').innerText = "00:00";
            document.getElementById('startBtn').classList.add('hidden');
        }
    </script>
</body>
</html>
